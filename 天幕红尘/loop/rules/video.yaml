- id: V-QA-FACE-METRIC
  status: active
  layer: 质检
  symptom: 表情问题靠肉眼判断，结论不稳定，也没法比较「改了有没有用」
  root_cause: 缺少量尺
  scope: [face_closeup, emotion_negative, crying, lipsync]
  action:
    process: >-
      出片后跑 loop/tools/face_metrics.py 作初筛：悲恸/冷硬镜头 laugh_read 高要人工复核；
      开 G4 做回归前，先用本地已有素材测一遍，确认假设成立再花钱。
      已知偏差：①蹙眉（AU4）不会算进 brow_in，闭嘴抿哭会被多报成「读成笑」；
      ②同一表演 480p 与 720p 读数差很大（21b：scout 4 帧，HD 40 帧，肉眼几乎一样）。
      只在同分辨率内比较；与肉眼冲突以肉眼为准
  evidence: [tools/face_metrics.py, ledger/experiments/2026-11-17_anchor.md]

- id: V-WAN-CFG1-NO-NEG
  status: active
  layer: 参数
  symptom: Wan 镜头堆负向词没有任何效果
  root_cause: >-
    Wan2.2 LightX2V 4 步蒸馏在 KSamplerAdvanced 里是 cfg=1.0，CFG=1 时负向条件根本不参与计算。
    自 v09 以来所有 Wan 负向词（NEG_BASE 的 smiling/laughing、背影防转身、防醉步……）都是零作用；
    当时「修好了」其实是换了种子或改了正向提示
  scope: [all_video, wan]
  action:
    process: >-
      Wan 阶段只靠关键帧、正向提示和种子；负向词只在 Qwen-Image i2i 阶段写。
      细微表情镜头每镜至少 4 个种子（V-SCOUT-THEN-HD 默认 2 个不够）。
      真要在 Wan 用负向，需另开 CFG>1 的非蒸馏路径（慢约 10 倍），先做回归
  evidence:
    - 视频/regress/2026-11-17_grief_au/plan.json（A/B 只有 neg 不同）
    - 视频/regress/2026-11-17_grief_au/scout（A/B 输出逐字节相同，md5 一致）
    - 视频/v09_fixes/stage2_clips_v09.py（cfg 1.0）
  regress: []
