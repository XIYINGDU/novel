# 视觉生成规则（Qwen-Image i2i / Wan2.2 I2V·FLF2V / 本地修补）
# 字段说明见 loop/README.md。status: active 已验证 | candidate 待验证 | deprecated 已退役
# scope 是「由此及彼」的入口：compile.py 按镜头标签命中规则。

- id: V-ANCHOR-STATE-LEAK
  status: candidate
  layer: 锚点
  symptom: 由参考图直接驱动的模型（InfiniteTalk、Flow 角色参考）出片跟着定妆照的表情、光线、道具走
  root_cause: 这类模型没有 i2i 首帧这一步，参考图的状态直接进入成片
  scope: [infinitetalk, flow_char_ref]
  action:
    process: 走参考图直驱的模型时，用中性锚点（嘴闭、无笑意、平光、无手持道具）或按镜头状态单独做锚点
  evidence:
    - 视频/ab21（21 号 InfiniteTalk 画面跟着定妆照：白天、无电话）
    - ledger/experiments/2026-11-17_anchor.md
  regress: []
  note: >-
    2026-11-17 去伪存真：原假设「锚点微笑泄漏导致 i2i→Wan 管线悲恸镜头假笑」被证伪。
    锚点 smile 0.74/0.69，但 i2i 关键帧全部 ≤0.04，笑在 i2i 步已被清掉。
    因此 scope 收窄到参考图直驱的模型，原 neg 词已移除。

- id: V-GRIEF-AU-PROMPT
  status: candidate
  layer: 提示词
  symptom: 哭戏被读成笑（眯眼、嘴角横拉、露齿、眉往下压）
  root_cause: >-
    Wan 把 crying/sobbing 画成「眯眼咧嘴」的痛苦怪相，和笑共用嘴角横拉；
    真悲伤的读法靠内眉上抬（AU1+4）、嘴角下拉（AU15）、下巴皱（AU17），这些它不会自动给。
    负向词 smiling/laughing 一直在 NEG_BASE 里也没用，因为模型并不认为自己在画笑
  scope: [emotion_negative, crying]  # 2026-11-17 xiying 批：去掉 face_closeup，非哭戏近景不再误命中
  action:
    prompt: [inner eyebrows raised and pinched upward, mouth corners pulled down, chin trembling, lips closed, wet eyes open]
    process: >-
      哭戏用面部动作单元描述，少用 crying/sobbing/weeping；
      有台词（要走 LatentSync）的镜头不写 lips closed，只写眉和嘴角，嘴交给口型；出片后跑 face_metrics，laugh_read 必须为 0
  evidence:
    - ledger/experiments/2026-11-17_anchor.md
    - 视频/ep01_p2/clips/clip_21b.mp4（smile 0.69，brow_in 0.005，读成笑 17/20 帧）
    - 视频/regress/2026-11-17_grief_au/metrics.json（读成笑 s1 61→45，s2 49→4）
  regress: [21b]
  note: >-
    2026-11-17 两轮回归：AU 描述不稳健。种子 8216：原 61 → AU 45；种子 8217：原 49 → AU(p1 措辞) 56 / AU(p2 措辞) 4。
    唯一的好结果来自特定措辞加特定种子。动作幅度（press 对 strike）在同一种子下 45 对 45，无影响，混杂假设证伪。
    保持候选；按目前证据，哭戏多开种子 + 人眼筛，比任何提示词技巧都可靠

- id: V-SPLIT-COMPOUND-ACTION
  status: active
  layer: 分镜
  symptom: 单镜多段姿态转换出现醉酒晃动、向后蹲坐、磕头式蜷缩
  root_cause: Wan2.2 14B 2–4s 单镜只能可靠完成一段姿态转换
  scope: [action_multi_pose]
  action:
    process: 一镜只承载一个姿态转换；复杂动作拆成因果咬合的短镜组，邻镜首尾姿态与地标连续
  evidence: [视频/v13_fixes/stage1_keyframes_v13.py, 视频/AI短剧制作经验总结.md#一]
  regress: ["01", 02b2]

- id: V-CONTINUITY-ADJACENT
  status: active
  layer: 分镜
  symptom: 空间瞬移（上一镜已站在平地，下一镜又在跨台阶）
  root_cause: 每镜首帧独立生成，没有继承上一镜末帧状态
  scope: [all_video]
  action:
    process: 下一镜起幅首帧用上一镜末帧（或其 i2i 变体）生成，写明景别/姿态/地标三项继承
  evidence: [视频/AI短剧制作经验总结.md#一]
  regress: [02b2]

- id: V-FLF2V-FOR-PRECISE-ENDS
  status: active
  layer: 参数
  symptom: 纯 I2V 动作终点不可控（血迹面积、倒地方向）
  root_cause: I2V 只锁起点；终点由模型自由发挥
  scope: [action_multi_pose, precise_end_state]
  action:
    process: 先 i2i 出 2–3 张同机位末帧候选择优，再走 WanFirstLastFrameToVideo
  evidence: [视频/v13_fixes/stage2_scout_hd_v13.py]
  regress: [02a, 02b2]

- id: V-BACK-VIEW-LOCK
  status: active
  layer: 提示词
  symptom: 背影镜头人物转头露侧脸
  root_cause: 模型倾向让人物朝向镜头
